services:
  mysql:
    image: mysql:8.0
    container_name: inventario_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_inventory
      MYSQL_USER: pymes
      MYSQL_PASSWORD: pymes123
    ports:
      # Usa 3307 en el host para no chocar con MySQL local en Windows.
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: inventario_ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 15 && ollama pull qwen2.5:3b && wait"]

  backend:
    build: ./backend
    container_name: inventario_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "mysql://root:root@mysql:3306/ai_inventory"
      JWT_SECRET: "cambia-esta-clave-en-produccion"
      JWT_EXPIRES_IN: "7d"
      ML_SERVICE_URL: "http://ml-service:8000"
      CORS_ORIGIN: "http://localhost:8080"
      LLM_PROVIDER: "ollama"
      OLLAMA_URL: "http://ollama:11434/v1"
      OLLAMA_MODEL: "qwen2.5:3b"
    command: >
      sh -c "npx prisma db push &&
             npm run seed &&
             node src/index.js"
    ports:
      - "${BACKEND_HOST_PORT:-4000}:4000"

  ml-service:
    build: ./ml-service
    container_name: inventario_ml
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8000
      MODEL_PATH: app/models/demanda_rf.joblib
      MIN_VENTAS_PARA_ML: 5
      HORIZONTE_DIAS: 7
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: ai_inventory
    ports:
      - "${ML_HOST_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    container_name: inventario_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # http://localhost:8080 por defecto; cambia FRONTEND_HOST_PORT si prefieres otro.
      - "${FRONTEND_HOST_PORT:-8080}:80"

volumes:
  mysql_data:
  ollama_data:
  